name: Auto Unzip Phase 1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and flatten files
        run: |
          unzip -o alpha-war-room-phase1.zip -d temp_extract
          SUBDIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$SUBDIR" ]; then cp -rn "$SUBDIR"/. .; else cp -rn temp_extract/. .; fi
          rm -rf temp_extract alpha-war-room-phase1.zip
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-extract Phase 1 project files"
          git push
