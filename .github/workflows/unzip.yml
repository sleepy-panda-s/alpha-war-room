name: Auto Unzip Phase 1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and flatten files safely
        run: |
          unzip -o alpha-war-room-phase1.zip -d temp_extract
          SUBDIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$SUBDIR" ] && [ -f "$SUBDIR/README.md" ]; then SRC="$SUBDIR"; else SRC="temp_extract"; fi
          if [ -d "$SRC/.github/workflows" ]; then mkdir -p workflows_backup && cp -rn "$SRC/.github/workflows"/. workflows_backup/ && rm -rf "$SRC/.github/workflows"; fi
          cp -rn "$SRC"/. .
          rm -rf temp_extract alpha-war-room-phase1.zip
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-extract Phase 1 project files"
          git push
